version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hello
      - hi
      - hey there
      - good morning
      - good afternoon
      - greetings

  - intent: goodbye
    examples: |
      - goodbye
      - bye
      - see you later
      - talk to you soon
      - catch you later

  - intent: wake
    examples: |
      - wake up
      - Raven wake up
      - please wake up
      - I need you
      - are you there
      - come back online

  - intent: sleep
    examples: |
      - go to sleep
      - sleep now
      - rest
      - take a nap
      - power down

  - intent: weather
    examples: |
      - what is the weather
      - what's the temperature
      - is it raining
      - forecast for today
      - how hot is it in [Los Gatos](location)
      - will it rain in [New York](location)
      - temperature in [San Diego](location)

  - intent: acknowledge
    examples: |
      - all right
      - okay
      - mm-hmm
      - got it
      - sure
      - fine
      - yep
      - I understand
      - understand

  - intent: ai_query
    examples: |
      - role is helpful assistant
      - temperature should be 0.7
      - what's the history of San Diego
      - who is Alan Turing
      - what caused the fall of the Roman Empire
      - tell me how neural networks work
      - explain string theory
      - when was the Declaration of Independence signed
      - where is the International Space Station
      - why is the sky blue
      - how does gravity work
