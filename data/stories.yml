version: "3.1"

stories:
  - story: User puts Raven to sleep
    steps:
      - intent: sleep
      - action: action_go_to_sleep

  - story: User wakes Raven up
    steps:
      - intent: wake
      - action: action_wake

  - story: User says hi and then goodbye
    steps:
      - intent: greet
      - action: utter_greet
      - intent: goodbye
      - action: utter_goodbye
