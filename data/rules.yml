version: "3.1"

rules:
  - rule: Raven goes to sleep
    steps:
      - intent: sleep
      - action: action_go_to_sleep

  - rule: Raven wakes up
    steps:
      - intent: wake
      - action: action_wake

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet
