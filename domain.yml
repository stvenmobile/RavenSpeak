version: "3.1"

intents:
  - greet
  - goodbye
  - sleep
  - wake
  - weather       # Assuming you have weather intent too

actions:
  - action_go_to_sleep
  - action_wake
  - action_weather  # Include if defined in your actions.py

responses:
  utter_greet:
    - text: "Hello! How can I help you?"

  utter_goodbye:
    - text: "Goodbye! Talk to you soon."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
